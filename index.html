<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff77b7"><meta name="description" content="#fitcheck — colourful feel-good movement planner">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>#fitcheck ✦</title>
<style>
:root{--ink:#30243b;--muted:#76677f;--pink:#ff79b7;--purple:#9c83ff;--line:#f0dced;--shadow:0 12px 35px #70426a18}
*{box-sizing:border-box}body{margin:0;color:var(--ink);font:16px/1.45 ui-rounded,"Trebuchet MS",system-ui,sans-serif;background:linear-gradient(135deg,#fff0f8,#f1efff 48%,#eafaff);min-height:100vh}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.shell{max-width:1050px;margin:auto;padding:22px 16px 45px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.brand{font-size:clamp(2.2rem,7vw,3.5rem);font-weight:1000;letter-spacing:-.08em;color:#553a70;text-shadow:3px 3px 0 #ffb9d9;line-height:1}.brand span{color:#f35eaa}.tagline{color:var(--muted);font-size:.9rem;margin-top:6px}.pill{background:#fff9;border:1px solid white;padding:9px 13px;border-radius:99px;font-size:.8rem;font-weight:800}
nav{display:flex;gap:8px;overflow:auto;padding:5px 2px 13px;margin-bottom:12px}nav button{white-space:nowrap;background:#ffffffb5;border:1px solid white;padding:10px 14px;border-radius:99px;color:var(--muted);font-weight:800}nav button.active{background:var(--ink);color:white}
h2{font-size:1.5rem;letter-spacing:-.04em;margin:0 0 5px}h3{font-size:1rem;margin:0 0 8px}.sub{color:var(--muted);margin:0 0 18px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.card{background:#ffffffdf;border:1px solid white;border-radius:21px;padding:17px;box-shadow:var(--shadow);min-width:0}.s4{grid-column:span 4}.s6{grid-column:span 6}.s12{grid-column:span 12}
.stat{font-size:2rem;font-weight:950;letter-spacing:-.06em}.tiny{font-size:.82rem;color:var(--muted)}.track{height:10px;border-radius:99px;background:#f2e9f3;overflow:hidden;margin:8px 0}.fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--pink),var(--purple))}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.btn{padding:10px 14px;border-radius:13px;background:var(--ink);color:white;font-weight:800}.btn.soft{background:#f8e9f4;color:#75476a}.btn.mini{padding:7px 10px;font-size:.82rem}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:white;color:var(--ink)}textarea{min-height:85px;resize:vertical}label{display:block;font-weight:800;font-size:.84rem;margin:10px 0 5px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.checks{display:grid;gap:9px}.check{display:flex;gap:9px;align-items:center}.check input{width:auto;accent-color:#e86cab}.item{padding:11px 0;border-bottom:1px solid var(--line)}.chip{display:inline-block;padding:5px 9px;border-radius:99px;background:#f6e9ff;color:#684c85;font-size:.75rem;font-weight:800;margin:2px}.day{background:#fff7fc;border:1px solid var(--line);border-radius:15px;padding:12px;margin:8px 0}.day strong{min-width:42px;display:inline-block}.meal{border-radius:15px;padding:13px;background:#fff5d9;margin:8px 0}.meal:nth-child(2n){background:#f4efff}.empty{text-align:center;color:var(--muted);padding:15px}footer{text-align:center;color:var(--muted);font-size:.78rem;margin-top:25px}
@media(max-width:700px){.shell{padding:16px 12px 35px}.s4,.s6{grid-column:span 12}.formgrid{grid-template-columns:1fr}.card{padding:15px}}
</style></head><body><div class="shell" id="app">
<header><div><div class="brand">#fit<span>check</span> ✦</div><div class="tagline">move a little · feel good · make it yours</div></div><div class="pill">Y2K ENERGY ☆</div></header>
<nav id="nav"><button data-page="home" class="active">✿ Home</button><button data-page="planner">▦ Planner</button><button data-page="log">＋ Log</button><button data-page="guide">⚡ Exercise guide</button><button data-page="meals">♡ Meals</button><button data-page="goals">☆ Goals</button><button data-page="diary">▤ Diary</button></nav>
<main id="content"></main><footer>Your pace is the point. Rest days count too. ✦<br>Saved in this browser on this device — no account or cloud sync.</footer></div>
<script>
(()=>{
const KEY='fitcheck-standalone-v1', defaults={habits:[{name:'Move in a way I enjoy',done:false},{name:'Take a stretch break',done:false},{name:'Eat regular, satisfying meals',done:false},{name:'Drink water throughout the day',done:false},{name:'Make time to rest',done:false}],water:0,logs:[],diary:[],goals:[{name:'Try a new activity',target:4,progress:0,unit:'sessions'}],week:[['Mon','Strength & mobility'],['Tue','Dance / fun cardio'],['Wed','Stretch or yoga'],['Thu','Strength & mobility'],['Fri','Walk / cycle / sport'],['Sat','Choose your own adventure'],['Sun','Rest & reset']],custom:[],page:'home'};
let state;try{state={...defaults,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){state={...defaults}}
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}},today=()=>new Date().toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'});
const exercises=[['Bodyweight squats','Strength','A controlled sit-back movement. Use a chair for support if helpful.'],['Wall push-ups','Strength','Face a wall, place hands on it and gently bend and straighten elbows.'],['Glute bridges','Strength','Lie on your back with knees bent, lift hips gently, then lower.'],['Bird dog','Strength','From hands and knees, reach opposite arm and leg, then switch.'],['Dancing','Cardio','Put on favourite songs and move in whatever way feels fun.'],['Brisk walk','Cardio','Walk at a pace that feels energising but still lets you talk.'],['Marching in place','Cardio','March gently on the spot, swinging your arms naturally.'],['Gentle yoga flow','Flexibility','Link comfortable stretches with slow breathing.'],['Shoulder rolls','Mobility','Roll your shoulders slowly forwards and backwards.'],['Cat-cow stretch','Flexibility','On hands and knees, gently round and arch your back.']];
const page=(t,d,b)=>`<section><h2>${t}</h2><p class="sub">${d}</p>${b}</section>`;
function home(){let mins=state.logs.reduce((a,x)=>a+(+x.minutes||0),0),done=state.habits.filter(x=>x.done).length,idx=new Date().getDay()===0?6:new Date().getDay()-1;
return page('Hey, welcome back ✿',`Today is ${today()} — check in with yourself, no pressure.`,`<div class="grid">
<div class="card s4"><div class="tiny">MOVEMENT SESSIONS LOGGED</div><div class="stat">${state.logs.length}</div><div class="tiny">Every kind of movement counts.</div></div>
<div class="card s4"><div class="tiny">MINUTES YOU'VE LOGGED</div><div class="stat">${mins}</div><div class="tiny">A diary, not a target.</div></div>
<div class="card s4"><div class="tiny">HABITS CHECKED</div><div class="stat">${done}/${state.habits.length}</div><div class="track"><div class="fill" style="width:${state.habits.length?done/state.habits.length*100:0}%"></div></div></div>
<div class="card s6"><div class="row"><h3>Today's little checklist</h3><span class="chip">daily reset</span></div><div class="checks">${state.habits.map((h,i)=>`<label class="check"><input type="checkbox" data-habit="${i}" ${h.done?'checked':''}> ${esc(h.name)}</label>`).join('')}</div><div class="row" style="margin-top:12px"><button class="btn soft mini" data-action="reset-habits">Reset checklist</button><button class="btn soft mini" data-action="add-habit">＋ Add habit</button></div></div>
<div class="card s6"><div class="row"><h3>Water check-in 💧</h3><span class="chip">${state.water} glasses</span></div><div class="stat">${state.water} <span class="tiny">glasses today</span></div><div class="row"><button class="btn" data-action="water-plus">＋ Add a glass</button><button class="btn soft" data-action="water-reset">Reset</button></div><p class="tiny" style="margin:12px 0 0">A gentle reminder to sip throughout the day. Your needs vary.</p></div>
<div class="card s12"><div class="row"><div><h3>Your weekly idea</h3><div class="tiny">Flexible inspiration, not a rule.</div></div><button class="btn soft mini" data-page="planner">Open planner →</button></div><div class="day"><strong>${esc(state.week[idx]?.[0]||'Today')}</strong> ${esc(state.week[idx]?.[1]||'Choose something you enjoy')}</div></div></div>`)}
function planner(){return page('Your week ▦','Edit these ideas to fit your energy, schedule and interests.',`<div class="card">${state.week.map((d,i)=>`<div class="day row"><strong>${esc(d[0])}</strong><input data-week="${i}" aria-label="${esc(d[0])} plan" value="${esc(d[1])}" style="max-width:78%"></div>`).join('')}<button class="btn" data-action="save-week">Save my week</button> <button class="btn soft" data-action="reset-week">Restore sample week</button></div>`)}
function logPage(){return page('Log a little win ＋','Record any movement you feel like remembering. A short session counts.',`<div class="card"><form id="logform"><div class="formgrid"><div><label>Activity</label><input name="activity" required placeholder="e.g. danced to 3 songs"></div><div><label>Minutes (optional)</label><input name="minutes" type="number" min="0" max="600" placeholder="e.g. 15"></div><div><label>How did it feel?</label><select name="feeling"><option>Good</option><option>Okay</option><option>Relaxing</option><option>Challenging</option><option>Just for fun</option></select></div><div><label>Sets / reps (optional)</label><input name="details" placeholder="e.g. 2 sets, comfortable pace"></div></div><label>Notes (optional)</label><textarea name="notes" placeholder="Anything you want to remember?"></textarea><p style="margin-top:12px"><button class="btn">Save activity</button></p></form></div><div class="card" style="margin-top:14px"><h3>Recent activity</h3>${state.logs.slice(0,10).map((x,i)=>`<div class="item row"><div><b>${esc(x.activity)}</b><div class="tiny">${esc(x.date)} · ${esc(x.feeling)} · ${x.minutes||0} min</div></div><button class="btn soft mini" data-delete-log="${i}">Delete</button></div>`).join('')||'<div class="empty">Your first log will show up here ✨</div>'}</div>`)}
function guide(){let all=[...exercises,...state.custom];return page('Exercise guide ⚡','Simple ideas with options. Choose movements that feel comfortable and take breaks whenever you need.',`<div class="grid">${all.map((x,i)=>`<div class="card s6"><span class="chip">${esc(x[1])}</span><h3>${esc(x[0])}</h3><p class="tiny">${esc(x[2])}</p><button class="btn soft mini" data-quick="${i}">Log this activity</button>${i>=exercises.length?` <button class="btn soft mini" data-remove-custom="${i-exercises.length}">Remove</button>`:''}</div>`).join('')}</div><div class="card" style="margin-top:14px"><h3>Add your own activity</h3><form id="exerciseform"><label>Name</label><input name="name" required placeholder="e.g. skating"><label>Type</label><select name="type"><option>Strength</option><option>Cardio</option><option>Flexibility</option><option>Sport</option><option>Other</option></select><label>Helpful note</label><input name="note" placeholder="What makes it work for you?"><p style="margin-top:12px"><button class="btn">Add activity</button></p></form></div>`)}
function meals(){let ideas=[['Breakfast','Toast with eggs or beans and fruit'],['Breakfast','Yoghurt with cereal, fruit and nuts or seeds'],['Lunch','A hummus, cheese or chicken wrap with crunchy veg'],['Lunch','Rice bowl with vegetables and tofu, beans or chicken'],['Dinner','Pasta with tomato sauce, vegetables and cheese'],['Dinner','Jacket potato with beans and a side salad'],['Snack','Banana and peanut butter toast'],['Snack','Crackers and cheese, or yoghurt and fruit']];return page('Meal inspiration ♡','Ideas for balanced, satisfying food — no calorie counting or food rules.',`<div class="grid">${ideas.map(x=>`<div class="card s6"><span class="chip">${x[0]}</span><div class="meal">${x[1]}</div></div>`).join('')}</div><p class="tiny" style="margin-top:12px">Mix and match based on what you enjoy, what’s available and what helps you feel satisfied. Snacks are welcome.</p>`)}
function goals(){return page('Your goals ☆','Pick goals about skills, enjoyment or routines — not changing your body.',`<div class="card"><form id="goalform"><label>What would you like to work towards?</label><input name="name" required placeholder="e.g. learn a new dance move"><div class="formgrid"><div><label>Target number</label><input name="target" type="number" min="1" max="100" value="4"></div><div><label>Count in</label><select name="unit"><option>sessions</option><option>practice days</option><option>tries</option><option>skills learned</option></select></div></div><p style="margin-top:12px"><button class="btn">Add goal</button></p></form></div>${state.goals.map((g,i)=>`<div class="card" style="margin-top:12px"><div class="row"><div><h3>${esc(g.name)}</h3><div class="tiny">${g.progress} / ${g.target} ${esc(g.unit)}</div></div><button class="btn soft mini" data-delete-goal="${i}">Remove</button></div><div class="track"><div class="fill" style="width:${Math.min(100,g.progress/g.target*100)}%"></div></div><button class="btn mini" data-goal-plus="${i}">＋ Update progress</button></div>`).join('')}`)}
function diary(){return page('Your diary ▤','Keep notes about what you enjoyed or what you want to try next.',`<div class="card"><form id="diaryform"><label>Today's note</label><textarea name="note" required placeholder="Today I enjoyed…"></textarea><p style="margin-top:12px"><button class="btn">Save diary entry</button></p></form></div><div class="card" style="margin-top:14px"><h3>Past entries</h3>${state.diary.map((d,i)=>`<div class="item"><div class="row"><b>${esc(d.date)}</b><button class="btn soft mini" data-delete-diary="${i}">Delete</button></div><p style="margin:8px 0 0">${esc(d.note)}</p></div>`).join('')||'<div class="empty">Your notes will live here ✨</div>'}</div>`)}
const pages={home,planner,log:logPage,guide,meals,goals,diary};
function render(){if(!pages[state.page])state.page='home';$('#content').innerHTML=pages[state.page]();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));save()}
function go(p){state.page=p;render();window.scrollTo({top:0,behavior:'smooth'})}
$('#nav').addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b)go(b.dataset.page)});
$('#content').addEventListener('change',e=>{if(e.target.dataset.habit!==undefined){state.habits[+e.target.dataset.habit].done=e.target.checked;save();render()}});
$('#content').addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;
if(b.dataset.page){go(b.dataset.page);return}
switch(b.dataset.action){case'water-plus':state.water++;break;case'water-reset':state.water=0;break;case'reset-habits':state.habits.forEach(h=>h.done=false);break;case'add-habit':{let n=prompt('Name your new habit');if(n?.trim())state.habits.push({name:n.trim(),done:false});break}case'save-week':document.querySelectorAll('[data-week]').forEach(x=>state.week[+x.dataset.week][1]=x.value);b.textContent='Saved ✓';break;case'reset-week':state.week=JSON.parse(JSON.stringify(defaults.week));break}
if(b.dataset.deleteLog!==undefined)state.logs.splice(+b.dataset.deleteLog,1);
if(b.dataset.deleteDiary!==undefined)state.diary.splice(+b.dataset.deleteDiary,1);
if(b.dataset.deleteGoal!==undefined)state.goals.splice(+b.dataset.deleteGoal,1);
if(b.dataset.goalPlus!==undefined)state.goals[+b.dataset.goalPlus].progress++;
if(b.dataset.quick!==undefined){let x=[...exercises,...state.custom][+b.dataset.quick];state.logs.unshift({activity:x[0],minutes:0,feeling:'Just for fun',date:today()});save();go('log');return}
if(b.dataset.removeCustom!==undefined)state.custom.splice(+b.dataset.removeCustom,1);
save();render()});
$('#content').addEventListener('submit',e=>{e.preventDefault();let f=e.target,d=new FormData(f);
if(f.id==='logform')state.logs.unshift({activity:d.get('activity'),minutes:d.get('minutes'),feeling:d.get('feeling'),details:d.get('details'),notes:d.get('notes'),date:today()});
if(f.id==='diaryform')state.diary.unshift({note:d.get('note'),date:today()});
if(f.id==='goalform')state.goals.push({name:d.get('name'),target:Math.max(1,+d.get('target')||1),progress:0,unit:d.get('unit')});
if(f.id==='exerciseform')state.custom.push([d.get('name'),d.get('type'),d.get('note')||'Your own movement idea.']);
save();render()});
render();
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
</script></body></html>
